name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'pnpm'
    - run: pnpm install
    - run: pnpm run lint
    - run: pnpm run build